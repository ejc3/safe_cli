# Cut a release: push a tag like v0.1.0 and GoReleaser builds the four platform binaries
# (linux/darwin × amd64/arm64), archives + checksums, and a GitHub Release with the tag
# stamped into `safe_cli version`. Config: .goreleaser.yaml.
name: release

on:
  push:
    tags:
      - "v*"

# The default token needs write to create the Release and upload assets.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser needs full history + tags to compute the version and changelog.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
