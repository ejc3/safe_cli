name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repo. Keep the token read-only and do not let
# actions/checkout leave credentials in the local git config for later steps.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (build, vet, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          # Current Go series: backward-compatible with the go.mod minimum, and it carries the
          # stdlib security fixes govulncheck requires (many reachable CVEs are fixed in 1.25.x).
          go-version: "1.25"
          cache: true

      # gofmt is not part of `go vet`; a formatting drift should fail CI, not be
      # silently reformatted later. `-l` lists offenders; any output => fail.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # go.mod / go.sum must stay tidy — a drift (a stray or missing dep) fails CI
      # rather than being silently committed.
      - name: go mod tidy check
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod / go.sum are not tidy — run 'go mod tidy' and commit:"
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      # -race catches the data races that a descriptor-driven dispatcher plus
      # concurrent HTTP is prone to; it is cheap for a suite this size.
      - name: go test
        run: go test -race ./...

      - name: build
        run: go build ./...

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      # v7+ of the action drives golangci-lint v2 (the schema .golangci.yml uses).
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          # govulncheck fails only on vulnerabilities the code actually calls; run it on
          # the same current Go the rest of CI builds with so the scan reflects reality.
          go-version: "1.25"
          check-latest: true
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...
