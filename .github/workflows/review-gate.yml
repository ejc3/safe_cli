# The enforcement half of CLAUDE.md's review governance.
#
# GitHub's native `required_conversation_resolution` enforces only that inline
# threads are marked *resolved*; it says nothing about the disposition tokens the
# governance requires. This gate additionally fails the PR unless each resolved
# thread carries a RED-VERIFIED / NOT-A-DEFECT / DISAGREE disposition and each
# review body a REVIEW-ACK.
#
# It lives in its own workflow, apart from the Go build in ci.yml, for one reason:
# the trigger set. A gate that ran only on the default `pull_request` activities
# (opened/synchronize/reopened) is re-evaluated only when a commit is pushed. A
# finding added *after* the last push — a review submitted, an inline reply — would
# not re-run it, so a previously green result stays attached to the head SHA while
# native conversation-resolution clears, and the PR merges with an undisposed
# finding. So this fires on the review-state events too, and keeping it separate
# means those events do not also rebuild Go.
#
# The required check is the COMMIT STATUS `review-gate/disposition`, which this job
# posts — NOT the job's own check-run. Two GitHub facts forced that:
#   1. `cancel-in-progress: true` leaves a *cancelled* check-run that branch
#      protection latches onto and blocks merge even after a later run passes.
#   2. Several check-runs of one name on a head SHA are ambiguous to branch
#      protection.
# A commit status is idempotent per (SHA, context): the latest post wins and none
# accumulate, so re-evaluating on every event can never strand a stale check. The
# job therefore always exits 0 (its own check-run is irrelevant) and encodes the
# real verdict in the status it posts. cancel-in-progress is false as belt-and-
# suspenders so a run is never cancelled mid-post.
#
# One residual, in the SAFE direction: GitHub emits no workflow event when a thread
# is *resolved*, so if resolving is the last action the status can stay stale-
# failure (only ever blocks merge). Make the closing action a comment (a disposition
# / REVIEW-ACK reply is a pull_request_review_comment, which re-fires this) — the
# status then reflects the settled state.
name: review-gate

on:
  pull_request:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

# statuses:write to post the commit status; the rest read-only. gh graphql reads
# reviewThreads/reviews/comments with pull-requests:read.
permissions:
  contents: read
  pull-requests: read
  statuses: write

# Queue re-evaluations of the SAME pr; do NOT cancel — a cancelled run is the very
# thing that strands a blocking check. Keyed by PR number (every trigger carries one).
concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: check review threads and post the disposition status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The script fails closed (exit 2) when it cannot run, so any non-zero is a
          # failing status — a gate that could not evaluate never reports success.
          if .claude/skills/pr-review-gate/check-review-threads.sh "$PR"; then
            state=success
            desc="every thread resolved and disposed"
          else
            state=failure
            desc="unresolved or undisposed review threads — see the run log"
          fi
          gh api "repos/$REPO_OWNER/$REPO_NAME/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="review-gate/disposition" \
            -f description="$desc" \
            -f target_url="$RUN_URL"
          echo "posted review-gate/disposition = $state for $HEAD_SHA"
