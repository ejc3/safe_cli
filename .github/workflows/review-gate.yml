# The enforcement half of CLAUDE.md's review governance.
#
# GitHub's native `required_conversation_resolution` enforces only that inline
# threads are marked *resolved*; it says nothing about the disposition tokens the
# governance requires. This gate additionally fails the PR unless each resolved
# thread carries a RED-VERIFIED / NOT-A-DEFECT / DISAGREE disposition and each
# review body a REVIEW-ACK.
#
# It lives in its own workflow, apart from the Go build in ci.yml, for the trigger
# set. A gate on the default `pull_request` activities alone (opened/synchronize/
# reopened) is re-evaluated only on push, so a finding added after the last push —
# a review submitted, an inline reply — would leave a previously green result on the
# head SHA while native resolution clears, and the PR merges with an undisposed
# finding. So this fires on the review-state events too, and keeping it separate
# means those events do not also rebuild Go.
#
# The signal is this job's own CHECK-RUN (its exit code) — NOT a commit status.
# A commit status would need `statuses: write`, which GitHub forces to read-only for
# fork PRs, so the required context would never post and every external PR would be
# permanently unmergeable (codex P1 on #109). A check-run needs no write access.
#
# `cancel-in-progress: false` is the load-bearing fix: with it true, a superseded run
# leaves a *cancelled* check-run that branch protection latches onto and blocks merge
# even after a later run passes (the stuck state hit on #107). Queueing instead means
# every run completes success/failure and the latest governs.
#
# One residual, in the SAFE direction: GitHub emits no workflow event when a thread is
# *resolved*, so if resolving is the last action the check can stay stale-failure
# (only ever blocks merge). Make the closing action a comment (a disposition /
# REVIEW-ACK reply is a pull_request_review_comment, which re-fires this) so the check
# reflects the settled state.
name: review-gate

on:
  pull_request:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

# Read-only — no write scope, so the gate runs identically on fork PRs. gh graphql
# reads reviewThreads/reviews/comments with pull-requests:read.
permissions:
  contents: read
  pull-requests: read

# Queue re-evaluations of the SAME pr; do NOT cancel — a cancelled run is the very
# thing that strands a blocking check. Keyed by PR number (every trigger carries one).
concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: check review threads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        # Fails closed: the script exits 2 when it cannot run (gh/jq missing or the
        # query errors), so the check-run is red for a gate that could not evaluate.
        run: .claude/skills/pr-review-gate/check-review-threads.sh "${{ github.event.pull_request.number }}"
