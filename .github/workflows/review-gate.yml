# A visibility signal for CLAUDE.md's review governance — NOT an iron-clad merge gate.
#
# GitHub's native `required_conversation_resolution` is the hard gate: a PR cannot
# merge while an inline thread is unresolved. This workflow adds a check-run that goes
# RED when a resolved thread is missing its disposition token (RED-VERIFIED /
# NOT-A-DEFECT / DISAGREE) or a review body its REVIEW-ACK — so the author NOTICES
# there is feedback to answer. It is intentionally informational: it is not a required
# status check, so it never leaves a PR mysteriously stuck; it just surfaces the state.
#
# It fires on the review-state events (not only on push) so a finding added after the
# last commit still turns the check red without needing a new push. `cancel-in-progress:
# false` so re-evaluations queue rather than cancel (a cancelled run reads as a scary
# grey X). It fails closed (the script exits non-zero when it cannot run).
name: review-gate

on:
  pull_request:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

# Read-only: the gate only queries review threads; it never writes.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: check review threads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: .claude/skills/pr-review-gate/check-review-threads.sh "${{ github.event.pull_request.number }}"
